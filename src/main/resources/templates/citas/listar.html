<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Listado de Citas</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    
    <!-- Contenido Principal -->
    <div class="container my-5">
        <!-- Título y Botón -->
        <div class="row mb-4">
            <div class="col-md-8">
                <h2 class="fw-bold">
                    <i class="fas fa-calendar-alt text-info me-2"></i>
                    <span th:text="${titulo}">Listado de Citas</span>
                </h2>
            </div>
            <div class="col-md-4 text-end">
                <a th:href="@{/citas/nueva}" class="btn btn-info text-white">
                    <i class="fas fa-plus-circle me-2"></i>Nueva Cita
                </a>
            </div>
        </div>
        
        <!-- Mensajes de éxito/error -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="fas fa-check-circle me-2"></i>
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="fas fa-exclamation-triangle me-2"></i>
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        
        <!-- Tabla de Citas -->
        <div class="card shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Paciente</th>
                                <th>Médico</th>
                                <th>Especialidad</th>
                                <th>Fecha</th>
                                <th>Hora</th>
                                <th>Estado</th>
                                <th>Motivo</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(citas)}">
                                <td colspan="9" class="text-center text-muted py-4">
                                    <i class="fas fa-calendar-times fa-3x mb-3 d-block"></i>
                                    No hay citas registradas
                                </td>
                            </tr>
                            <tr th:each="cita : ${citas}">
                                <td th:text="${cita.idCita}">1</td>
                                <td>
                                    <strong th:text="${cita.paciente.nombres + ' ' + cita.paciente.apellidos}"></strong>
                                    <br>
                                    <small class="text-muted" th:text="${cita.paciente.dni}"></small>
                                </td>
                                <td>
                                    <strong th:text="${cita.medico.nombres + ' ' + cita.medico.apellidos}"></strong>
                                    <br>
                                    <small class="text-muted" th:text="${cita.medico.correo}"></small>
                                </td>
                                <td>
                                    <span class="badge bg-primary" 
                                          th:text="${cita.medico.especialidad.nombre}">
                                    </span>
                                </td>
                                <td th:text="${#temporals.format(cita.fecha, 'dd/MM/yyyy')}">01/01/2025</td>
                                <td th:text="${#temporals.format(cita.hora, 'HH:mm')}">09:00</td>
                                <td>
                                    <span class="badge" 
                                          th:classappend="${cita.estado == 'PROGRAMADA' ? 'bg-info' : 
                                                          (cita.estado == 'COMPLETADA' or cita.estado == 'ATENDIDA' ? 'bg-success' : 
                                                          (cita.estado == 'CANCELADA' ? 'bg-danger' : 'bg-secondary'))}"
                                          th:text="${cita.estado == 'ATENDIDA' ? 'COMPLETADA' : cita.estado}">
                                    </span>
                                </td>
                                <td>
                                    <small th:text="${cita.motivo}">Consulta general</small>
                                </td>
                                <td class="text-center">
                                    <div class="btn-group" role="group">
                                        <a th:href="@{'/citas/editar/' + ${cita.idCita}}" 
                                           class="btn btn-sm btn-warning" 
                                           title="Editar"
                                           th:if="${cita.estado != 'CANCELADA' and cita.estado != 'ATENDIDA'}">
                                            <i class="fas fa-edit"></i>
                                        </a>
                                        <a th:href="@{'/citas/cancelar/' + ${cita.idCita}}" 
                                           class="btn btn-sm btn-secondary" 
                                           title="Cancelar"
                                           th:if="${cita.estado == 'PROGRAMADA'}"
                                           onclick="return confirm('¿Está seguro de cancelar esta cita?')">
                                            <i class="fas fa-ban"></i>
                                        </a>
                                        <a th:href="@{'/citas/eliminar/' + ${cita.idCita}}" 
                                           class="btn btn-sm btn-danger" 
                                           title="Eliminar"
                                           onclick="return confirm('¿Está seguro de eliminar esta cita?')">
                                            <i class="fas fa-trash"></i>
                                        </a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        
        <!-- Información adicional -->
        <div class="row mt-3">
            <div class="col-md-4">
                <div class="card text-center">
                    <div class="card-body">
                        <h5 class="card-title text-info">
                            <i class="fas fa-clock me-2"></i>Programadas
                        </h5>
                        <h2 class="fw-bold" th:text="${#lists.size(citas.?[estado == 'PROGRAMADA'])}">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-center">
                    <div class="card-body">
                        <h5 class="card-title text-success">
                            <i class="fas fa-check-circle me-2"></i>Completadas
                        </h5>
                        <h2 class="fw-bold" th:text="${#lists.size(citas.?[estado == 'COMPLETADA' or estado == 'ATENDIDA'])}">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-center">
                    <div class="card-body">
                        <h5 class="card-title text-danger">
                            <i class="fas fa-times-circle me-2"></i>Canceladas
                        </h5>
                        <h2 class="fw-bold" th:text="${#lists.size(citas.?[estado == 'CANCELADA'])}">0</h2>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
