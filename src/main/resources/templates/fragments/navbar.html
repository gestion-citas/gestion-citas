<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <!-- Navbar Fragment -->
    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark" 
         style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-hospital-user me-2"></i>
                Gestión Médica
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" 
                    data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">
                            <i class="fas fa-home me-1"></i>Inicio
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/medicos">
                            <i class="fas fa-user-md me-1"></i>Médicos
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/pacientes">
                            <i class="fas fa-users me-1"></i>Pacientes
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/citas">
                            <i class="fas fa-calendar-alt me-1"></i>Citas
                        </a>
                    </li>
                    
                    <!-- Usuario logueado -->
                    <li class="nav-item dropdown" th:if="${session.usuario != null}">
                        <a class="nav-link dropdown-toggle" href="#" role="button" 
                           data-bs-toggle="dropdown">
                            <i class="fas fa-user-circle me-1"></i>
                            <span th:text="${session.usuario.nombreUsuario}"></span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="/perfil">Mi Perfil</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="/logout">Cerrar Sesión</a></li>
                        </ul>
                    </li>
                    
                    <!-- Botón Login si no está logueado -->
                    <li class="nav-item" th:if="${session.usuario == null}">
                        <a class="btn btn-outline-light btn-sm" href="/login">
                            <i class="fas fa-sign-in-alt me-1"></i>Ingresar
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</body>
</html>
