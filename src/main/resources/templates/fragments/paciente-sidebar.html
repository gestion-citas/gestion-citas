<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <!-- Sidebar Fragment -->
    <aside th:fragment="sidebar" class="sidebar">
        <a href="/" class="sidebar-brand">
            <i class="fas fa-heartbeat"></i>

        </a>
        <ul class="sidebar-nav">
            <li>
                <a th:href="@{/paciente/dashboard}" class="nav-link">
                    <i class="fas fa-home"></i>
                    <span>Inicio</span>
                </a>
            </li>
            <li>
                <a th:href="@{/paciente/citas}" class="nav-link">
                    <i class="fas fa-calendar-check"></i>
                    <span>Mis Citas</span>
                </a>
            </li>
            <li>
                <a th:href="@{/paciente/registrar-cita}" class="nav-link">
                    <i class="fas fa-plus-circle"></i>
                    <span>Nueva Cita</span>
                </a>
            </li>
            <li>
                <a th:href="@{/paciente/perfil}" class="nav-link">
                    <i class="fas fa-user-circle"></i>
                    <span>Mi Perfil</span>
                </a>
            </li>
            <li style="margin-top: 30px;">
                <a href="/auth/logout" style="color: rgba(255, 255, 255, 0.6);">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Cerrar Sesión</span>
                </a>
            </li>
        </ul>
    </aside>

    <script>
        // Marcar como activo el enlace actual
        document.addEventListener('DOMContentLoaded', function() {
            const currentPath = window.location.pathname;
            const navLinks = document.querySelectorAll('.nav-link');
            
            navLinks.forEach(link => {
                if (link.getAttribute('href') === currentPath) {
                    link.classList.add('active');
                }
            });
        });
    </script>
</body>
</html>
