<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <!-- Sidebar Fragment -->
    <aside th:fragment="sidebar" class="sidebar">
        <div style="text-align: center; margin-bottom: 40px;">

        </div>
        <ul class="sidebar-nav">
            <li>
                <a th:href="@{/medico/dashboard}" class="nav-link">
                    <i class="fas fa-chart-line"></i>
                    <span>Dashboard</span>
                </a>
            </li>
            <li>
                <a th:href="@{/medico/citas}" class="nav-link">
                    <i class="fas fa-calendar-check"></i>
                    <span>Citas</span>
                </a>
            </li>
            <li>
                <a th:href="@{/medico/pacientes}" class="nav-link">
                    <i class="fas fa-users"></i>
                    <span>Pacientes</span>
                </a>
            </li>

            <li>
                <a th:href="@{/medico/perfil}" class="nav-link">
                    <i class="fas fa-user-circle"></i>
                    <span>Mi Perfil</span>
                </a>
            </li>
            <li style="margin-top: 30px;">
                <a href="/auth/logout" style="color: rgba(255, 255, 255, 0.6);">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Cerrar Sesión</span>
                </a>
            </li>
        </ul>
    </aside>

    <script>
        // Marcar como activo el enlace actual
        document.addEventListener('DOMContentLoaded', function() {
            const currentPath = window.location.pathname;
            const navLinks = document.querySelectorAll('.nav-link');
            
            navLinks.forEach(link => {
                if (link.getAttribute('href') === currentPath) {
                    link.classList.add('active');
                }
            });
        });
    </script>
</body>
</html>
