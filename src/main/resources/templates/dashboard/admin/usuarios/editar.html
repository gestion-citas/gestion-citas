<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h2>Editar Usuario</h2>
        <form th:action="@{/admin/usuarios/actualizar}" method="post">
            <input type="hidden" name="idUsuario" th:value="${usuario.idUsuario}">
            
            <div class="mb-3">
                <label class="form-label">Username *</label>
                <input type="text" class="form-control" name="username" th:value="${usuario.username}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Email *</label>
                <input type="email" class="form-control" name="email" th:value="${usuario.email}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Contraseña (dejar vacío para no cambiar)</label>
                <input type="password" class="form-control" name="password">
            </div>
            <div class="mb-3">
                <label class="form-label">Nombres</label>
                <input type="text" class="form-control" name="nombres" th:value="${usuario.nombres}">
            </div>
            <div class="mb-3">
                <label class="form-label">Apellidos</label>
                <input type="text" class="form-control" name="apellidos" th:value="${usuario.apellidos}">
            </div>
            <div class="mb-3">
                <label class="form-label">Rol *</label>
                <select class="form-select" name="role" required>
                    <option value="ADMIN" th:selected="${usuario.role == 'ADMIN'}">Administrador</option>
                    <option value="MEDICO" th:selected="${usuario.role == 'MEDICO'}">Médico</option>
                    <option value="RECEPCIONISTA" th:selected="${usuario.role == 'RECEPCIONISTA'}">Recepcionista</option>
                    <option value="PACIENTE" th:selected="${usuario.role == 'PACIENTE'}">Paciente</option>
                </select>
            </div>
            
            <button type="submit" class="btn btn-primary">Guardar Cambios</button>
            <a href="/admin/usuarios" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</body>
</html>
