<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Usuario - Gestión de Citas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin-dashboard.css}">
    <style>
        .form-wrapper {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .form-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }
        .form-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .form-header h1 {
            color: #333;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .form-header p {
            color: #666;
            font-size: 14px;
        }
        .form-group label {
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .form-control, .form-select {
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 12px;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        .form-control:focus, .form-select:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .btn-submit {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: 600;
            width: 100%;
            transition: all 0.3s ease;
            margin-top: 20px;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
            color: white;
        }
        .btn-cancel {
            background: #f0f0f0;
            color: #333;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-cancel:hover {
            background: #e0e0e0;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .form-row.full {
            grid-template-columns: 1fr;
        }
        .error-message {
            color: #dc3545;
            font-size: 12px;
            margin-top: 5px;
        }
        .icon-input {
            position: relative;
        }
        .icon-input i {
            position: absolute;
            left: 15px;
            top: 40px;
            color: #667eea;
        }
        .form-control.icon-pad {
            padding-left: 40px;
        }
    </style>
</head>
<body>
    <div class="form-wrapper">
        <div class="form-container">
            <!-- Header -->
            <div class="form-header">
                <h1>➕ Crear Nuevo Usuario</h1>
                <p>Completa el formulario para registrar un nuevo usuario</p>
            </div>

            <!-- Alertas -->
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Formulario -->
            <form th:action="@{/admin/usuarios/guardar}" method="post" th:object="${usuario}" novalidate>
                <input type="hidden" th:field="*{idUsuario}">

                <!-- Fila 1: Usuario y Email -->
                <div class="form-row">
                    <div class="form-group icon-input">
                        <label for="username">👤 Usuario *</label>
                        <i class="fas fa-user"></i>
                        <input type="text" class="form-control icon-pad" id="username" 
                               th:field="*{username}" placeholder="ejemplo_user" required>
                        <div class="error-message" th:if="${#fields.hasErrors('username')}" 
                             th:errors="*{username}"></div>
                    </div>
                    <div class="form-group icon-input">
                        <label for="email">📧 Email *</label>
                        <i class="fas fa-envelope"></i>
                        <input type="email" class="form-control icon-pad" id="email" 
                               th:field="*{email}" placeholder="usuario@ejemplo.com" required>
                        <div class="error-message" th:if="${#fields.hasErrors('email')}" 
                             th:errors="*{email}"></div>
                    </div>
                </div>

                <!-- Fila 2: Nombres y Apellidos -->
                <div class="form-row">
                    <div class="form-group icon-input">
                        <label for="nombres">👤 Nombres</label>
                        <i class="fas fa-user"></i>
                        <input type="text" class="form-control icon-pad" id="nombres" 
                               th:field="*{nombres}" placeholder="Juan">
                    </div>
                    <div class="form-group icon-input">
                        <label for="apellidos">👤 Apellidos</label>
                        <i class="fas fa-user"></i>
                        <input type="text" class="form-control icon-pad" id="apellidos" 
                               th:field="*{apellidos}" placeholder="Pérez García">
                    </div>
                </div>

                <!-- Fila 3: Contraseña y Rol -->
                <div class="form-row">
                    <div class="form-group icon-input">
                        <label for="password">🔐 Contraseña *</label>
                        <i class="fas fa-lock"></i>
                        <input type="password" class="form-control icon-pad" id="password" 
                               th:field="*{password}" placeholder="••••••••" required>
                        <div class="error-message" th:if="${#fields.hasErrors('password')}" 
                             th:errors="*{password}"></div>
                    </div>
                    <div class="form-group">
                        <label for="role">🛡️ Rol *</label>
                        <select class="form-select" id="role" th:field="*{role}" required>
                            <option value="">-- Seleccionar rol --</option>
                            <option value="ADMIN">👑 Administrador</option>
                            <option value="MEDICO">🏥 Médico</option>
                            <option value="PACIENTE">👤 Paciente</option>
                            <option value="RECEPCIONISTA">📞 Recepcionista</option>
                        </select>
                        <div class="error-message" th:if="${#fields.hasErrors('role')}" 
                             th:errors="*{role}"></div>
                    </div>
                </div>

                <!-- Estado -->
                <div class="form-row full">
                    <div class="form-group">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="activo" 
                                   th:field="*{activo}" checked>
                            <label class="form-check-label" for="activo">
                                ✅ Usuario Activo
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Botones -->
                <div class="d-flex gap-2 mt-4">
                    <a href="/admin/dashboard" class="btn btn-cancel flex-grow-1">
                        <i class="fas fa-times"></i> Cancelar
                    </a>
                    <button type="submit" class="btn btn-submit flex-grow-1">
                        <i class="fas fa-save"></i> Crear Usuario
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
