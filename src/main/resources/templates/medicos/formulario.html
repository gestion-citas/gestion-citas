<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Formulario Médico</title>
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS Personalizado -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    
    <!-- Contenido Principal -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <!-- Título -->
                <div class="mb-4">
                    <h2 class="fw-bold">
                        <i class="fas fa-user-md text-primary me-2"></i>
                        <span th:text="${titulo}">Formulario Médico</span>
                    </h2>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb">
                            <li class="breadcrumb-item"><a th:href="@{/}">Inicio</a></li>
                            <li class="breadcrumb-item"><a th:href="@{/medicos}">Médicos</a></li>
                            <li class="breadcrumb-item active" th:text="${accion == 'nuevo' ? 'Nuevo' : 'Editar'}">Nuevo</li>
                        </ol>
                    </nav>
                </div>
                
                <!-- Formulario -->
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <form th:action="@{/medicos/guardar}" 
                              th:object="${medico}" 
                              method="post">
                            
                            <!-- ID oculto (solo para edición) -->
                            <input type="hidden" th:field="*{idMedico}">
                            
                            <div class="row">
                                <!-- DNI -->
                                <div class="col-md-6 mb-3">
                                    <label for="dni" class="form-label">
                                        <i class="fas fa-id-card me-1"></i>DNI *
                                    </label>
                                    <input type="text" 
                                           class="form-control" 
                                           id="dni" 
                                           th:field="*{dni}" 
                                           placeholder="Ej: 12345678"
                                           maxlength="8"
                                           pattern="[0-9]{8}"
                                           required>
                                    <div class="form-text">Debe tener 8 dígitos</div>
                                </div>
                                
                                <!-- Nombres -->
                                <div class="col-md-6 mb-3">
                                    <label for="nombres" class="form-label">
                                        <i class="fas fa-user me-1"></i>Nombres *
                                    </label>
                                    <input type="text" 
                                           class="form-control" 
                                           id="nombres" 
                                           th:field="*{nombres}" 
                                           placeholder="Ej: Juan Carlos"
                                           required>
                                </div>
                            </div>
                            
                            <div class="row">
                                <!-- Apellidos -->
                                <div class="col-md-6 mb-3">
                                    <label for="apellidos" class="form-label">
                                        <i class="fas fa-user me-1"></i>Apellidos *
                                    </label>
                                    <input type="text" 
                                           class="form-control" 
                                           id="apellidos" 
                                           th:field="*{apellidos}" 
                                           placeholder="Ej: Pérez García"
                                           required>
                                </div>
                                
                                <!-- Especialidad -->
                                <div class="col-md-6 mb-3">
                                    <label for="especialidad" class="form-label">
                                        <i class="fas fa-stethoscope me-1"></i>Especialidad *
                                    </label>
                                    <select class="form-select" 
                                            id="especialidad" 
                                            th:field="*{especialidad.idEspecialidad}" 
                                            required>
                                        <option value="">Seleccione una especialidad</option>
                                        <option th:each="esp : ${especialidades}" 
                                                th:value="${esp.idEspecialidad}" 
                                                th:text="${esp.nombre}">
                                        </option>
                                    </select>
                                </div>
                            </div>
                            
                            <div class="row">
                                <!-- Correo -->
                                <div class="col-md-6 mb-3">
                                    <label for="correo" class="form-label">
                                        <i class="fas fa-envelope me-1"></i>Correo Electrónico *
                                    </label>
                                    <input type="email" 
                                           class="form-control" 
                                           id="correo" 
                                           th:field="*{correo}" 
                                           placeholder="correo@ejemplo.com"
                                           required>
                                </div>
                                
                                <!-- Teléfono -->
                                <div class="col-md-6 mb-3">
                                    <label for="telefono" class="form-label">
                                        <i class="fas fa-phone me-1"></i>Teléfono *
                                    </label>
                                    <input type="tel" 
                                           class="form-control" 
                                           id="telefono" 
                                           th:field="*{telefono}" 
                                           placeholder="999999999"
                                           maxlength="9"
                                           pattern="[0-9]{9}"
                                           required>
                                    <div class="form-text">Debe tener 9 dígitos</div>
                                </div>
                            </div>
                            
                            <!-- Botones -->
                            <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                                <a th:href="@{/medicos}" class="btn btn-secondary">
                                    <i class="fas fa-times me-2"></i>Cancelar
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save me-2"></i>
                                    <span th:text="${accion == 'nuevo' ? 'Crear Médico' : 'Actualizar Médico'}">
                                        Guardar
                                    </span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
                
                <!-- Nota informativa -->
                <div class="alert alert-info mt-3" role="alert">
                    <i class="fas fa-info-circle me-2"></i>
                    <strong>Nota:</strong> Los campos marcados con (*) son obligatorios.
                </div>
            </div>
        </div>
    </div>
    
    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
