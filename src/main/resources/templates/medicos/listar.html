<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Listado de Médicos</title>
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS Personalizado -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    
    <!-- Contenido Principal -->
    <div class="container my-5">
        <!-- Título y Botón -->
        <div class="row mb-4">
            <div class="col-md-8">
                <h2 class="fw-bold">
                    <i class="fas fa-user-md text-primary me-2"></i>
                    <span th:text="${titulo}">Listado de Médicos</span>
                </h2>
            </div>
            <div class="col-md-4 text-end">
                <a th:href="@{/medicos/nuevo}" class="btn btn-primary">
                    <i class="fas fa-plus-circle me-2"></i>Nuevo Médico
                </a>
            </div>
        </div>
        
        <!-- Mensajes de éxito/error -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="fas fa-check-circle me-2"></i>
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="fas fa-exclamation-triangle me-2"></i>
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        
        <!-- Tabla de Médicos -->
        <div class="card shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>DNI</th>
                                <th>Nombres</th>
                                <th>Apellidos</th>
                                <th>Especialidad</th>
                                <th>Correo</th>
                                <th>Teléfono</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(medicos)}">
                                <td colspan="8" class="text-center text-muted py-4">
                                    <i class="fas fa-inbox fa-3x mb-3 d-block"></i>
                                    No hay médicos registrados
                                </td>
                            </tr>
                            <tr th:each="medico : ${medicos}">
                                <td th:text="${medico.idMedico}">1</td>
                                <td th:text="${medico.dni}">12345678</td>
                                <td th:text="${medico.nombres}">Juan</td>
                                <td th:text="${medico.apellidos}">Pérez</td>
                                <td>
                                    <span class="badge bg-primary" 
                                          th:text="${medico.especialidad.nombre}">
                                        Cardiología
                                    </span>
                                </td>
                                <td th:text="${medico.correo}">correo@ejemplo.com</td>
                                <td th:text="${medico.telefono}">999999999</td>
                                <td class="text-center">
                                    <div class="btn-group" role="group">
                                        <a th:href="@{'/medicos/editar/' + ${medico.idMedico}}" 
                                           class="btn btn-sm btn-warning" 
                                           title="Editar">
                                            <i class="fas fa-edit"></i>
                                        </a>
                                        <a th:href="@{'/medicos/eliminar/' + ${medico.idMedico}}" 
                                           class="btn btn-sm btn-danger" 
                                           title="Eliminar"
                                           onclick="return confirm('¿Está seguro de eliminar este médico?')">
                                            <i class="fas fa-trash"></i>
                                        </a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        
        <!-- Información adicional -->
        <div class="mt-3 text-muted">
            <small>
                <i class="fas fa-info-circle me-1"></i>
                Total de médicos: <strong th:text="${#lists.size(medicos)}">0</strong>
            </small>
        </div>
    </div>
    
    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
