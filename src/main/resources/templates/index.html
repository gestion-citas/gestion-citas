<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión Médica - Inicio</title>
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS Personalizado -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    
    <!-- Hero Section -->
    <section class="hero-section">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-lg-8 mx-auto text-center fade-in">
                    <h1 class="display-3 fw-bold mb-4">
                        <i class="fas fa-heartbeat me-3"></i>
                        Salud a un Clic
                    </h1>
                    <p class="lead mb-4">
                        Gestiona tus citas médicas de forma fácil y rápida
                    </p>
                    <div class="d-grid gap-3 d-sm-flex justify-content-sm-center">
                        <a href="/citas/nueva" class="btn btn-light btn-lg px-4">
                            <i class="fas fa-calendar-plus me-2"></i>Agendar Cita
                        </a>
                        <a href="/especialidades" class="btn btn-outline-light btn-lg px-4">
                            <i class="fas fa-stethoscope me-2"></i>Ver Especialidades
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </section>
    
    <!-- Estadísticas -->
    <section class="py-5 bg-light">
        <div class="container">
            <div class="row text-center">
                <div class="col-md-3 mb-4">
                    <div class="card border-0 shadow-sm">
                        <div class="card-body">
                            <i class="fas fa-user-md fa-3x text-primary mb-3"></i>
                            <h3 class="fw-bold" th:text="${totalMedicos}">0</h3>
                            <p class="text-muted mb-0">Médicos</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-3 mb-4">
                    <div class="card border-0 shadow-sm">
                        <div class="card-body">
                            <i class="fas fa-users fa-3x text-success mb-3"></i>
                            <h3 class="fw-bold" th:text="${totalPacientes}">0</h3>
                            <p class="text-muted mb-0">Pacientes</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-3 mb-4">
                    <div class="card border-0 shadow-sm">
                        <div class="card-body">
                            <i class="fas fa-calendar-check fa-3x text-info mb-3"></i>
                            <h3 class="fw-bold" th:text="${totalCitas}">0</h3>
                            <p class="text-muted mb-0">Citas Hoy</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-3 mb-4">
                    <div class="card border-0 shadow-sm">
                        <div class="card-body">
                            <i class="fas fa-stethoscope fa-3x text-warning mb-3"></i>
                            <h3 class="fw-bold" th:text="${totalEspecialidades}">0</h3>
                            <p class="text-muted mb-0">Especialidades</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    
    <!-- Especialidades Destacadas -->
    <section class="py-5">
        <div class="container">
            <h2 class="text-center mb-5 fw-bold">Nuestras Especialidades</h2>
            <div class="row">
                <div th:each="especialidad : ${especialidades}" class="col-md-4 mb-4">
                    <div class="card h-100">
                        <div class="card-body text-center">
                            <i class="fas fa-heartbeat fa-3x text-primary mb-3"></i>
                            <h5 class="card-title" th:text="${especialidad.nombre}">Especialidad</h5>
                            <p class="text-muted">Atención especializada y de calidad</p>
                            <a th:href="@{'/medicos?especialidad=' + ${especialidad.idEspecialidad}}" 
                               class="btn btn-outline-primary">
                                Ver Médicos
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    
    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
