# ==========================================
# CONFIGURACION DE BASE DE DATOS
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/gestion_citas?useSSL=false&serverTimezone=America/Lima&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# CONFIGURACION DE JPA/HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.sql.init.mode=always

# Puerto estándar de la aplicación
server.port=8080
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.open-in-view=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl


# ==========================================
# LOGGING Y DEBUG
# ==========================================
logging.level.root=WARN
logging.level.com.cibertec=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.web=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ==========================================
# CONFIGURACION DE LA APLICACION
# ==========================================
server.servlet.context-path=/
spring.application.name=gestion-citas

# ==========================================
# CONFIGURACION DE DEVTOOLS
# ==========================================
spring.devtools.restart.enabled=true
spring.devtools.restart.additional-paths=src/main/java

# ==========================================
# CONFIGURACION DE SESION
# ==========================================
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false

# ==========================================
# CONFIGURACION DE THYMELEAF
# ==========================================
spring.thymeleaf.check-template=true
spring.thymeleaf.check-template-location=true
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.content-type=text/html
spring.thymeleaf.cache=false

# ==========================================
# CONFIGURACION DE RECURSOS ESTATICOS
# ==========================================
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
spring.web.resources.cache.period=0
spring.mvc.static-path-pattern=/static/**